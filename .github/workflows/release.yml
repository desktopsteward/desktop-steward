name: Release bundles
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  bundle:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node scripts/build-mcpb.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.mcpb
